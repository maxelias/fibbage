<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fibbage — Host</title>
<style>
  :root{
    --ink:#20261f;
    --paper:#faf6ea;
    --yellow:#ffd400;
    --yellow-deep:#f0b400;
    --teal:#1f6f6a;
    --teal-deep:#164f4b;
    --coral:#e85d4a;
    --line: rgba(32,38,31,0.14);
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(circle at 6px 6px, rgba(32,38,31,0.06) 1.4px, transparent 1.4px);
    background-size: 26px 26px;
    color:var(--ink);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    min-height:100vh;
    padding: 28px 18px 60px;
  }
  .wrap{max-width: 1100px; margin:0 auto;}
  .layout{
    display:grid;
    grid-template-columns: 1fr 240px;
    gap:24px;
    align-items:start;
  }
  .sidebar{
    position:sticky;
    top:20px;
    border:2px solid var(--ink);
    border-radius:4px;
    background:var(--card);
    box-shadow:6px 6px 0 var(--ink);
    overflow:hidden;
  }
  .sidebar h3{
    margin:0;
    font-family:Verdana, sans-serif;
    font-size:0.72rem;
    letter-spacing:0.03em;
    color:white;
    background:var(--ink);
    padding:10px 14px;
  }
  .tally-list{
    list-style:none; margin:0; padding:0;
  }
  .tally-list li{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 14px;
    border-bottom:1px solid var(--line);
    font-family: Verdana, sans-serif;
  }
  .tally-list li:last-child{ border-bottom:none; }
  .tally-list li.leader{ background: #fff9dd; }
  .tally-list .tname{
    font-family:'Baskerville',Georgia,serif;
    font-size:1rem;
  }
  .tally-list .tpts{
    font-weight:bold;
    background:var(--yellow);
    border:1px solid var(--ink);
    border-radius:999px;
    padding:1px 10px;
    font-size:0.85rem;
  }
  .tally-rank{
    display:inline-block; width:18px; color:#999; font-size:0.72rem; margin-right:4px;
  }
  @media (max-width: 760px){
    .layout{ grid-template-columns: 1fr; }
    .sidebar{ position:static; order:-1; }
  }
  header.top{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom: 3px solid var(--ink);
    padding-bottom:14px;
    margin-bottom: 22px;
    flex-wrap:wrap;
    gap:8px;
  }
  header.top h1{
    font-family: 'Baskerville', Georgia, serif;
    font-size: 2rem;
    margin:0;
    letter-spacing: -0.01em;
  }
  header.top h1 .q{
    color: var(--coral);
    font-style: italic;
  }
  header.top .tagline{
    font-family: Verdana, sans-serif;
    font-size: 0.72rem;
    color: var(--teal-deep);
    max-width: 300px;
    line-height:1.4;
    text-align:right;
  }
  .scorebar{
    display:flex; gap:10px; flex-wrap:wrap; margin-bottom: 24px;
  }
  .score-chip{
    background:var(--card);
    border:2px solid var(--ink);
    border-radius: 999px;
    padding: 6px 16px;
    font-family: Verdana, sans-serif;
    font-size: 0.8rem;
    display:flex; align-items:center; gap:8px;
  }
  .score-chip b{font-family:'Baskerville',Georgia,serif; font-size:1rem;}
  .score-chip .pts{background:var(--yellow); border-radius:999px; padding:1px 9px; font-weight:bold;}
  .panel{
    background:var(--card);
    border:2px solid var(--ink);
    border-radius: 4px;
    padding: 26px 28px;
    margin-bottom: 20px;
    box-shadow: 6px 6px 0 var(--ink);
  }
  h2.step-title{
    font-family: Verdana, sans-serif;
    text-transform: none;
    font-size: 0.78rem;
    color: var(--teal-deep);
    letter-spacing: 0.02em;
    margin: 0 0 10px 0;
    display:flex;
    align-items:center;
    gap:8px;
  }
  h2.step-title::before{
    content:"";
    width:9px;height:9px;
    background:var(--coral);
    display:inline-block;
    border-radius:50%;
  }
  .setup-row{
    display:flex; gap:10px; margin-bottom:10px; align-items:center;
  }
  .setup-row input[type=text]{
    flex:1;
    font-family: Georgia, serif;
    font-size: 1rem;
    padding: 9px 12px;
    border: 2px solid var(--ink);
    border-radius: 3px;
    background: var(--paper);
  }
  button{
    font-family: Verdana, sans-serif;
    font-size: 0.82rem;
    font-weight:bold;
    padding: 10px 18px;
    border: 2px solid var(--ink);
    border-radius: 3px;
    background: var(--yellow);
    cursor:pointer;
    transition: transform 0.08s ease;
  }
  button:hover{ transform: translateY(-1px); }
  button:active{ transform: translateY(1px); }
  button.secondary{ background:var(--paper); }
  button.teal{ background:var(--teal); color:white; }
  button.coral{ background:var(--coral); color:white; }
  button.ghost{ background:transparent; border-color: var(--line); color: #555; box-shadow:none;}
  button:disabled{ opacity:0.4; cursor:not-allowed; }
  button.small{ padding:6px 12px; font-size:0.72rem; }
  .remove-x{
    background:transparent; border:none; box-shadow:none;
    color:var(--coral); font-size:1.1rem; padding:2px 8px; cursor:pointer;
  }
  .question-number{
    font-family: Verdana, sans-serif;
    font-size: 0.72rem;
    color:#888;
    margin-bottom: 6px;
  }
  .question-text{
    font-size: 1.5rem;
    line-height: 1.5;
    margin: 0 0 6px 0;
  }
  .question-text .blank{
    border-bottom: 3px solid var(--coral);
    padding: 0 6px;
  }
  .timer-box{
    display:flex; align-items:center; gap:16px;
    margin: 18px 0;
    font-family: Verdana, sans-serif;
  }
  .timer-display{
    font-family: 'Courier New', monospace;
    font-size: 2.4rem;
    font-weight:bold;
    background: var(--ink);
    color: var(--yellow);
    padding: 4px 18px;
    border-radius: 4px;
    min-width: 110px;
    text-align:center;
  }
  .timer-display.warn{ color: var(--coral); }
  .collect-grid{
    display:grid; grid-template-columns: 1fr; gap:10px;
    margin-top:14px;
  }
  .collect-row{
    display:flex; align-items:center; gap:10px;
  }
  .collect-row .gname{
    width:120px; flex-shrink:0;
    font-family: Verdana, sans-serif;
    font-weight:bold;
    font-size:0.82rem;
    color: var(--teal-deep);
  }
  .collect-row input[type=text]{
    flex:1;
    font-family: Georgia, serif;
    font-size:1rem;
    padding:8px 12px;
    border:2px solid var(--line);
    border-radius:3px;
  }
  .collect-row input[type=text]:focus{
    border-color: var(--ink);
    outline:none;
  }
  .truth-note{
    font-family: Verdana, sans-serif;
    font-size:0.72rem;
    color:#888;
    margin-top:14px;
    border-top: 1px dashed var(--line);
    padding-top:12px;
  }
  .reveal-list{
    list-style:none; padding:0; margin: 16px 0 0 0;
    display:flex; flex-direction:column; gap:10px;
  }
  .reveal-item{
    display:flex; align-items:center; gap:14px;
    border:2px solid var(--ink);
    border-radius:3px;
    padding: 10px 14px;
    background: var(--paper);
  }
  .reveal-item .letter{
    font-family:'Baskerville',Georgia,serif;
    font-weight:bold;
    font-size:1.2rem;
    width:28px; height:28px;
    display:flex; align-items:center; justify-content:center;
    background: var(--yellow);
    border:2px solid var(--ink);
    border-radius:50%;
    flex-shrink:0;
  }
  .reveal-item .txt{ flex:1; font-size:1.05rem; }
  .reveal-item.is-true{ border-color: var(--teal); }
  .reveal-item .tag{
    font-family:Verdana, sans-serif;
    font-size:0.65rem;
    color:white; background:var(--teal);
    padding:2px 8px; border-radius:999px;
  }
  .vote-grid{
    display:grid; grid-template-columns: 1fr; gap:10px; margin-top:14px;
  }
  .vote-row{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .vote-row .gname{
    width:120px; flex-shrink:0;
    font-family: Verdana, sans-serif;
    font-weight:bold;
    font-size:0.82rem;
    color: var(--teal-deep);
  }
  .vote-opt{
    font-family: Verdana, sans-serif;
    font-size:0.78rem;
    padding:6px 12px;
    border:2px solid var(--line);
    border-radius:999px;
    background:var(--card);
    cursor:pointer;
  }
  .vote-opt.selected{
    border-color: var(--ink);
    background: var(--yellow);
  }
  .results-list{ list-style:none; padding:0; margin:14px 0 0; display:flex; flex-direction:column; gap:8px;}
  .results-item{
    border:2px solid var(--ink); border-radius:3px; padding:10px 14px;
    background:var(--paper);
    font-family: Verdana, sans-serif;
    font-size:0.85rem;
    display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .results-item .desc{ flex:1; font-family: Georgia, serif; font-size:0.95rem;}
  .results-item .delta{
    font-weight:bold; white-space:nowrap;
  }
  .results-item .delta.pos{ color: var(--teal-deep); }
  .footer-actions{
    display:flex; justify-content: space-between; align-items:center;
    margin-top: 22px; flex-wrap:wrap; gap:10px;
  }
  .footer-actions .right-group{ display:flex; gap:10px; }
  .rules-toggle{
    font-family: Verdana, sans-serif;
    font-size:0.72rem;
    color: var(--teal-deep);
    cursor:pointer;
    text-decoration: underline;
    margin-top: -8px;
    margin-bottom: 16px;
    display:inline-block;
  }
  .rules-box{
    font-family: Verdana, sans-serif;
    font-size:0.76rem;
    line-height:1.7;
    background: #fffdf3;
    border:1px dashed var(--line);
    border-radius:3px;
    padding:14px 18px;
    margin-bottom: 18px;
    display:none;
  }
  .rules-box.open{ display:block; }
  .rules-box ul{ margin:6px 0 0 0; padding-left: 18px; }
  .final-badge{
    display:inline-block;
    background:var(--coral); color:white;
    font-family:Verdana, sans-serif;
    font-size:0.7rem; font-weight:bold;
    padding: 3px 10px; border-radius:999px;
    margin-left:8px;
    vertical-align:middle;
  }
  .empty-state{
    font-family: Verdana, sans-serif;
    color:#777; font-size:0.85rem; text-align:center; padding: 30px 10px;
  }
  select{
    font-family: Verdana, sans-serif;
    font-size:0.8rem;
    padding:8px 10px;
    border:2px solid var(--ink);
    border-radius:3px;
    background:var(--paper);
  }
  /* ---------- DISPLAY SCREEN (projector/TV view) ---------- */
  body.display-mode{
    background: var(--ink);
    color: var(--paper);
    padding: 0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .display-wrap{
    width:100%; max-width:1400px;
    padding: 60px 70px;
    display:grid;
    grid-template-columns: 1fr 320px;
    gap:50px;
    align-items:start;
  }
  .display-main{ min-width:0; }
  .display-eyebrow{
    font-family: Verdana, sans-serif;
    letter-spacing:0.05em;
    color: var(--yellow);
    font-size: 1.1rem;
    margin-bottom: 18px;
  }
  .display-question{
    font-family: 'Baskerville', Georgia, serif;
    font-size: 3rem;
    line-height:1.4;
    margin:0 0 30px 0;
  }
  .display-question .blank{ border-bottom:5px solid var(--coral); padding:0 10px; }
  .display-timer{
    font-family:'Courier New', monospace;
    font-size:5rem;
    font-weight:bold;
    color: var(--yellow);
    margin-bottom:20px;
  }
  .display-timer.warn{ color: var(--coral); }
  .display-msg{
    font-family: Verdana, sans-serif;
    font-size:1.3rem;
    color: rgba(250,246,234,0.7);
  }
  .display-options{
    list-style:none; margin:20px 0 0; padding:0;
    display:flex; flex-direction:column; gap:14px;
  }
  .display-options li{
    display:flex; align-items:center; gap:20px;
    background: rgba(250,246,234,0.06);
    border:2px solid rgba(250,246,234,0.25);
    border-radius:6px;
    padding: 16px 22px;
    font-size: 1.5rem;
  }
  .display-options li.is-true{
    border-color: var(--yellow);
    background: rgba(255,212,0,0.12);
  }
  .display-options li .dletter{
    font-family:'Baskerville',Georgia,serif;
    font-weight:bold;
    width:42px; height:42px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background: var(--yellow); color:var(--ink);
    border-radius:50%;
    font-size:1.4rem;
  }
  .display-options li .dtag{
    font-family:Verdana, sans-serif;
    font-size:0.85rem;
    background:var(--yellow); color:var(--ink);
    padding:3px 10px; border-radius:999px;
  }
  .display-results{
    list-style:none; margin:18px 0 0; padding:0;
    display:flex; flex-direction:column; gap:10px;
  }
  .display-results li{
    font-family: Verdana, sans-serif;
    font-size:1.15rem;
    display:flex; justify-content:space-between; gap:14px;
    border-bottom:1px solid rgba(250,246,234,0.18);
    padding-bottom:8px;
  }
  .display-results li .ddelta{ font-weight:bold; color: var(--yellow); white-space:nowrap; }
  .display-sidebar{
    border-left:2px solid rgba(250,246,234,0.25);
    padding-left: 36px;
  }
  .display-sidebar h3{
    font-family:Verdana, sans-serif;
    letter-spacing:0.05em;
    font-size:0.95rem;
    color: rgba(250,246,234,0.6);
    margin: 0 0 18px 0;
  }
  .display-tally li{
    list-style:none;
    display:flex; justify-content:space-between; align-items:center;
    font-family:'Baskerville',Georgia,serif;
    font-size:1.4rem;
    padding: 12px 0;
    border-bottom: 1px solid rgba(250,246,234,0.15);
  }
  .display-tally li:first-child{ color: var(--yellow); }
  .display-tally .dpts{
    font-family:Verdana, sans-serif;
    font-weight:bold;
    background: rgba(250,246,234,0.1);
    padding:3px 12px;
    border-radius:999px;
    font-size:1.05rem;
  }
  .display-tally li:first-child .dpts{ background: var(--yellow); color:var(--ink); }
  .display-final{
    display:inline-block;
    background:var(--coral); color:white;
    font-family:Verdana, sans-serif; font-size:0.85rem; font-weight:bold;
    padding:4px 12px; border-radius:999px; margin-bottom:14px;
  }
  .open-display-btn{
    background: var(--teal); color:white;
  }
  .how-to-play{
    font-family: Verdana, sans-serif;
    font-size:0.78rem;
    line-height:1.6;
    background:#f0f7f6;
    border:1px solid var(--teal);
    border-radius:4px;
    padding:14px 18px;
    margin-bottom:18px;
  }
  .how-to-play h3{
    margin:0 0 8px 0;
    font-size:0.85rem;
    color:var(--teal-deep);
  }
  .how-to-play ol{ margin:0; padding-left:18px; }
  .how-to-play li{ margin-bottom:4px; }
  @media (max-width: 900px){
    .display-wrap{ grid-template-columns: 1fr; padding: 36px 24px; }
    .display-sidebar{ border-left:none; border-top:2px solid rgba(250,246,234,0.25); padding-left:0; padding-top:24px; }
    .display-question{ font-size:2rem; }
    .display-timer{ font-size:3rem; }
  }
  @media (max-width:600px){
    .question-text{ font-size:1.2rem; }
    .timer-display{ font-size:1.8rem; }
    .collect-row .gname, .vote-row .gname{ width:90px; font-size:0.72rem;}
    header.top .tagline{ text-align:left; max-width:100%; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* School-appropriate Fibbage questions — silly but clean for classroom use */
const QUESTIONS = [
  { text: "In October of 2013, eight sixth-graders from a New York college prep school were hospitalized after someone released ______ in a classroom.", answer: "Axe body spray" },
  { text: "After an allergic reaction to steroids used to treat asthma, a 28-year-old woman started growing ______ on her head instead of hair.", answer: "fingernails" },
  { text: "The city of Olney, Illinois organizes an annual event in order to ______ squirrels.", answer: "count" },
  { text: "A Kickstarter campaign met its $30,000 goal on April 7, 2012 for its shoes designed for ______.", answer: "atheists" },
  { text: "Amerigo Vespucci, the man for whom America was named, was a ______ dealer.", answer: "pickle" },
  { text: "Walter Arnold received the world's first speeding ticket in 1896 for going ______ miles per hour.", answer: "8" },
  { text: "Tashirojima is an island off of Japan that is completely overrun by ______.", answer: "cats" },
  { text: "Maryland's official state sport is ______.", answer: "jousting" },
  { text: "In 1967, a small town in Ecuador elected an inanimate object mayor. The elected mayor was a ______.", answer: "foot powder" },
  { text: "A group known as the “Robin Hooders” in Keene, New Hampshire pay for other people's ______.", answer: "parking meters" },
  { text: "As a way to protest Belarus' police state, a Swedish group dropped hundreds of ______ from an airplane.", answer: "teddy bears" },
  { text: "Anatidaephobia is the fear that somewhere in the world a ______ is watching you.", answer: "duck" },
  { text: "Famed American poet Charles Bukowski's tombstone is engraved with the words “Don't ______.”", answer: "Try" },
  { text: "In 2013, Dell issued a recall after customers complained their laptops smelled like ______.", answer: "cat urine" },
  { text: "ROAD TRIP! When in Port Vila, Vanuatu be sure to check out their post office, which is unusual because it is ______.", answer: "underwater" },
  { text: "The secret code name for the project to invent the first microwave oven in the 1940s was ______.", answer: "Speedy Weenie" },
  { text: "The name for a group of porcupines is a ______.", answer: "prickle" },
  { text: "The original name for Pepsi was ______.", answer: "Brad's Drink" },
  { text: "According to a Logitech study, 49% of lost remote controls are found in the couch, while 4% are found in the ______.", answer: "fridge" },
  { text: "The 1995 Diagram Prize for Oddest Book Title of the Year went to the book Reusing Old ______.", answer: "Graves" }
];
let state = {
  phase: 'setup', // setup | write | collect | reveal | vote | results | done
  groups: [],
  roundIndex: 0,
  order: [], // shuffled question indices, filled at start
  submissions: {}, // groupId -> text
  options: [], // [{id, type:'true'|'lie', text, groupId?}]
  votes: {}, // groupId -> optionId
  timer: { remaining: 0, running: false, intervalId: null, total: 0 },
  finalRound: false,
  rulesOpen: false,
  howToOpen: true,
  lastResults: null,
  trueGuessers: [],
};
function uid(){ return Math.random().toString(36).slice(2,9); }
const isDisplay = new URLSearchParams(location.search).get('display') === '1';
const syncChannel = ('BroadcastChannel' in window) ? new BroadcastChannel('fibbage-sync') : null;
function broadcastState(){
  if(!syncChannel || isDisplay) return;
  const q = (state.order && state.order.length) ? QUESTIONS[state.order[state.roundIndex]] : null;
  const snapshot = {
    phase: state.phase,
    finalRound: state.finalRound,
    roundIndex: state.roundIndex,
    totalRounds: state.order ? state.order.length : 0,
    question: q ? q.text : null,
    answer: (state.phase === 'results' || state.phase === 'done') && q ? q.answer : null,
    timer: { remaining: state.timer.remaining, running: state.timer.running },
    options: (state.phase === 'reveal' || state.phase === 'vote' || state.phase === 'results')
      ? state.options.map(o => ({ letter: o.letter, text: o.text, isTrue: state.phase === 'results' ? o.type === 'true' : false }))
      : [],
    votesIn: state.phase === 'vote' ? Object.keys(state.votes).length : 0,
    votesTotal: state.phase === 'vote' ? state.groups.filter(g => !(state.trueGuessers||[]).includes(g.id)).length : state.groups.length,
    lastResults: state.phase === 'results' ? state.lastResults : null,
    groups: state.groups.map(g => ({ name: g.name, score: g.score })),
  };
  syncChannel.postMessage(snapshot);
}
function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <header class="top">
      <h1>Fibbage<span class="q">.</span></h1>
      <div class="tagline">
        Host screen — answers stay hidden until you reveal them.<br>
        <button class="open-display-btn small" data-role="openDisplay" style="margin-top:8px;">Open display screen &#10697;</button>
      </div>
    </header>
    <div class="layout">
      <div class="main-col">
        <div class="rules-toggle" onclick="toggleHowTo()">${state.howToOpen ? 'Hide' : 'Show'} how to play</div>
        <div class="how-to-play" style="display:${state.howToOpen ? 'block' : 'none'}">
          <h3>How to play (classroom version)</h3>
          <ol>
            <li><b>Write lies:</b> Host reads the question with a blank. Each year group writes a funny but believable fake answer on paper (or device). Leave blank only if you already know the real answer.</li>
            <li><b>Collect:</b> Host types in what each group wrote. The real answer is added automatically and mixed in.</li>
            <li><b>Reveal & vote:</b> Host reads all options aloud (A, B, C…). Groups vote for the one they think is the <i>real</i> answer. Groups who already knew it sit out the vote.</li>
            <li><b>Score:</b> +5 if you wrote the truth (or left blank knowing it). +2 for voting correctly. +2 per person your lie fools. Perfect Fibbage (fools everyone) = +10 bonus. Final round doubles all points.</li>
          </ol>
        </div>
        <div class="rules-toggle" onclick="toggleRules()">${state.rulesOpen ? 'Hide' : 'Show'} scoring rules</div>
        <div class="rules-box ${state.rulesOpen ? 'open' : ''}">
          <b>How points work</b>

function sidebar(){

/* ---------- helpers ---------- */
function fillBlank(text){
  return escapeHtml(text).replace('______', '<span class="blank">______</span>');
}
function finalBadge(){
  return state.finalRound ? '<span class="final-badge">FINAL — double points</span>' : '';
}
function formatTime(s){
  const m = Math.floor(s/60), sec = s%60;
  return `${m}:${sec.toString().padStart(2,'0')}`;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }
function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
/* ---------- timer ---------- */
function startTimer(seconds){
  clearTimer();
  state.timer.remaining = seconds;
  state.timer.total = seconds;
  state.timer.running = true;
  state.timer.intervalId = setInterval(()=>{
    state.timer.remaining--;
    if(state.timer.remaining<=0){
      state.timer.remaining = 0;
      state.timer.running = false;
      clearInterval(state.timer.intervalId);
    }
    updateTimerDisplayOnly();
  }, 1000);
  renderStage();
}
function toggleTimer(defaultSeconds){
  if(state.timer.running){
    state.timer.running = false;
    clearInterval(state.timer.intervalId);
    renderStage();
  } else if(state.timer.remaining > 0){
    state.timer.running = true;
    state.timer.intervalId = setInterval(()=>{
      state.timer.remaining--;
      if(state.timer.remaining<=0){
        state.timer.remaining = 0;
        state.timer.running = false;
        clearInterval(state.timer.intervalId);
      }
      updateTimerDisplayOnly();
    }, 1000);
    renderStage();
  } else {
    startTimer(defaultSeconds);
  }
}
function clearTimer(){
  if(state.timer.intervalId) clearInterval(state.timer.intervalId);
  state.timer.intervalId = null;
}
function resetTimer(){
  clearTimer();
  state.timer.running = false;
  state.timer.remaining = 0;
  state.timer.total = 0;
  renderStage();
}
function updateTimerDisplayOnly(){
  const el = document.querySelector('.timer-display');
  if(el){
    el.textContent = formatTime(state.timer.remaining);
    el.classList.toggle('warn', state.timer.remaining<=10 && state.timer.running);
  }
  const btn = document.querySelector('[data-role="timerToggle"]');
  if(btn && state.timer.remaining===0 && state.timer.running===false){
    const def = state.phase === 'write' ? 45 : 20;
    btn.textContent = `Start ${def}s`;
  }
  broadcastState();
}
/* ---------- actions ---------- */
function wireStage(){
  const openDisplayBtn = document.querySelector('[data-role="openDisplay"]');
  if(openDisplayBtn) openDisplayBtn.addEventListener('click', ()=>{
    const url = new URL(location.href);
    url.searchParams.set('display', '1');
    window.open(url.toString(), 'fibbage-display');
  });
  document.querySelectorAll('[data-role="gname"]').forEach(inp=>{
    inp.addEventListener('input', e=>{
      state.groups[+e.target.dataset.idx].name = e.target.value;
    });
  });
  const addBtn = document.querySelector('[data-role="addGroup"]');
  if(addBtn) addBtn.addEventListener('click', ()=>{
    state.groups.push({id: uid(), name: `Year ${state.groups.length+7}`, score: 0});
    renderStage();
  });
  document.querySelectorAll('[data-role="removeGroup"]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      state.groups.splice(+e.currentTarget.dataset.idx, 1);
      renderStage();
    });
  });
  const startBtn = document.querySelector('[data-role="startGame"]');
  if(startBtn) startBtn.addEventListener('click', ()=>{
    state.order = shuffle(QUESTIONS.map((_,i)=>i));
    state.roundIndex = 0;
    state.finalRound = false;
    beginRound();
  });
  const timerToggle = document.querySelector('[data-role="timerToggle"]');
  if(timerToggle) timerToggle.addEventListener('click', ()=>{
    const def = state.phase === 'write' ? 45 : 20;
    toggleTimer(def);
  });
  const timerReset = document.querySelector('[data-role="timerReset"]');
  if(timerReset) timerReset.addEventListener('click', resetTimer);
  const backToSetup = document.querySelector('[data-role="backToSetup"]');
  if(backToSetup) backToSetup.addEventListener('click', ()=>{
    clearTimer();
    state = { ...state, phase:'setup', groups: state.phase==='done' ? state.groups.map(g=>({...g, score:0})) : state.groups, submissions:{}, options:[], votes:{}, roundIndex:0, lastResults:null, trueGuessers:[], timer:{remaining:0,running:false,intervalId:null,total:0} };
    render();
  });
  const toCollect = document.querySelector('[data-role="toCollect"]');
  if(toCollect) toCollect.addEventListener('click', ()=>{
    clearTimer();
    state.phase = 'collect';
    resetTimerSilent();
    renderStage();
  });
  const backToWrite = document.querySelector('[data-role="backToWrite"]');
  if(backToWrite) backToWrite.addEventListener('click', ()=>{
    state.phase = 'write';
    renderStage();
  });
  document.querySelectorAll('[data-role="submission"]').forEach(inp=>{
    inp.addEventListener('input', e=>{
      state.submissions[e.target.dataset.gid] = e.target.value;
    });
  });
  const toReveal = document.querySelector('[data-role="toReveal"]');
  if(toReveal) toReveal.addEventListener('click', ()=>{
    buildOptions();
    state.phase = 'reveal';
    renderStage();
  });
  const backToCollect = document.querySelector('[data-role="backToCollect"]');
  if(backToCollect) backToCollect.addEventListener('click', ()=>{
    state.phase = 'collect';
    renderStage();
  });
  const toVote = document.querySelector('[data-role="toVote"]');
  if(toVote) toVote.addEventListener('click', ()=>{
    state.votes = {};
    clearTimer();
    resetTimerSilent();
    state.phase = 'vote';
    renderStage();
  });
  const backToReveal = document.querySelector('[data-role="backToReveal"]');
  if(backToReveal) backToReveal.addEventListener('click', ()=>{
    state.phase = 'reveal';
    renderStage();
  });
  document.querySelectorAll('[data-role="voteOpt"]').forEach(el=>{
    el.addEventListener('click', e=>{
      const gid = e.currentTarget.dataset.gid;
      const oid = e.currentTarget.dataset.oid;
      state.votes[gid] = oid;
      renderStage();
    });
  });
  const toResults = document.querySelector('[data-role="toResults"]');
  if(toResults) toResults.addEventListener('click', ()=>{
    computeResults();
    state.phase = 'results';
    renderStage();
  });
  const backToVote = document.querySelector('[data-role="backToVote"]');
  if(backToVote) backToVote.addEventListener('click', ()=>{
    // Undo the score changes from last compute so re-scoring is accurate
    if(state.lastResults && state.lastResults.scoreDeltas){
      state.lastResults.scoreDeltas.forEach(({gid, amount})=>{
        const g = state.groups.find(x=>x.id===gid);
        if(g) g.score -= amount;
      });
    }
    state.phase = 'vote';
    renderStage();
  });
  const nextRound = document.querySelector('[data-role="nextRound"]');
  if(nextRound) nextRound.addEventListener('click', ()=>{
    state.roundIndex++;
    if(state.roundIndex >= state.order.length){
      state.phase = 'done';
      renderStage();
    } else {
      state.finalRound = (state.roundIndex === state.order.length - 1);
      beginRound();
    }
  });
}
function resetTimerSilent(){
  state.timer = { remaining:0, running:false, intervalId:null, total:0 };
}
function beginRound(){
  clearTimer();
  state.submissions = {};
  state.options = [];
  state.votes = {};
  state.trueGuessers = [];
  state.lastResults = null;
  resetTimerSilent();
  state.phase = 'write';
  render();
}
function buildOptions(){
  const q = QUESTIONS[state.order[state.roundIndex]];
  const opts = [];
  opts.push({ id: 'TRUE', type:'true', text: q.answer });
  const trueGuessers = [];
  state.groups.forEach(g=>{
    const txt = (state.submissions[g.id] || '').trim();
    if(txt.length === 0){ trueGuessers.push(g.id); return; } // blank = guessed the truth
    if(txt.toLowerCase() === q.answer.toLowerCase()){ trueGuessers.push(g.id); return; } // wrote the truth
    opts.push({ id: g.id, type:'lie', text: txt, groupId: g.id });
  });
  const shuffled = shuffle(opts);
  const letters = 'ABCDEFGHIJ';
  shuffled.forEach((o,i)=>{ o.letter = letters[i]; });
  state.options = shuffled;
  state.trueGuessers = trueGuessers;
}
function computeResults(){
  const multiplier = state.finalRound ? 2 : 1;
  const lines = [];
  const scoreDeltas = []; // for undo support
  const lieOptions = state.options.filter(o=>o.type==='lie');
  const trueOption = state.options.find(o=>o.type==='true');
  const trueGuessers = state.trueGuessers || [];
  // groups who already guessed the real answer on paper get their +5 straight away
  trueGuessers.forEach(gid=>{
    const g = state.groups.find(g=>g.id===gid);
    if(!g) return;
    const amt = 5*multiplier;
    addScore(gid, amt);
    scoreDeltas.push({gid, amount: amt});
    lines.push({ desc: `${escapeHtml(g.name)} guessed the real answer on paper`, delta: amt });
  });
  // voting points (skip true-guessers here — they're already rewarded above)
  state.groups.forEach(g=>{
    if(trueGuessers.includes(g.id)) return;
    const votedId = state.votes[g.id];
    if(!votedId) return;
    if(votedId === g.id){
      lines.push({ desc: `${escapeHtml(g.name)} voted for their own answer`, delta: 0 });
      return;
    }
    if(votedId === trueOption.id){
      const amt = 2*multiplier;
      addScore(g.id, amt);
      scoreDeltas.push({gid: g.id, amount: amt});
      lines.push({ desc: `${escapeHtml(g.name)} found the real answer`, delta: amt });
    }
  });
  // fooling points per lie author
  lieOptions.forEach(opt=>{
    const foolCount = state.groups.filter(g => g.id !== opt.groupId && state.votes[g.id] === opt.id).length;
    if(foolCount > 0){
      const gained = foolCount * 2 * multiplier;
      addScore(opt.groupId, gained);
      scoreDeltas.push({gid: opt.groupId, amount: gained});
      const authorName = state.groups.find(g=>g.id===opt.groupId).name;
      lines.push({ desc: `${escapeHtml(authorName)}'s lie fooled ${foolCount} group${foolCount>1?'s':''}`, delta: gained });
      const otherGroupCount = state.groups.length - 1;
      if(foolCount === otherGroupCount && otherGroupCount > 0){
        const bonus = 10*multiplier;
        addScore(opt.groupId, bonus);
        scoreDeltas.push({gid: opt.groupId, amount: bonus});
        lines.push({ desc: `${escapeHtml(authorName)} pulled off a Perfect Fibbage!`, delta: bonus });
      }
    }
  });
  if(lines.length === 0){
    lines.push({ desc: 'No points scored this round', delta: 0 });
  }
  state.lastResults = { lines, scoreDeltas };
}
function addScore(groupId, amount){
  const g = state.groups.find(g=>g.id===groupId);
  if(g) g.score += amount;
}
function toggleRules(){
  state.rulesOpen = !state.rulesOpen;
  render();
}
function toggleHowTo(){
  state.howToOpen = !state.howToOpen;
  render();
}

      <div class="display-question">${fillBlankDisplay(snap.question)}</div>
      <ul class="display-options">
        ${snap.options.map(o=>`<li><div class="dletter">${o.letter}</div><div>${escapeHtml(o.text)}</div></li>`).join('')}
      </ul>
      <div class="display-msg" style="margin-top:20px;">Vote for the one you think is real&hellip;</div>
    `;
  } else if(snap.phase === 'vote'){
    mainHtml = `
      ${finalTag}
      <div class="display-eyebrow">${roundLabel} &mdash; voting now (${snap.votesIn}/${snap.votesTotal} in)</div>
      <div class="display-question">${fillBlankDisplay(snap.question)}</div>
      ${snap.timer.remaining > 0 || snap.timer.running ? `<div class="display-timer ${snap.timer.remaining<=10 && snap.timer.running ? 'warn':''}">${formatTime(snap.timer.remaining)}</div>` : ''}
      <ul class="display-options">
        ${snap.options.map(o=>`<li><div class="dletter">${o.letter}</div><div>${escapeHtml(o.text)}</div></li>`).join('')}
      </ul>
    `;
  } else if(snap.phase === 'results'){
    mainHtml = `
      ${finalTag}
      <div class="display-eyebrow">${roundLabel} &mdash; the real answer was&hellip;</div>
      <div class="display-question">${escapeHtml(snap.answer)}</div>
      <ul class="display-options">
        ${snap.options.map(o=>`<li class="${o.isTrue?'is-true':''}"><div class="dletter">${o.letter}</div><div>${escapeHtml(o.text)}</div>${o.isTrue?'<div class="dtag">real answer</div>':''}</li>`).join('')}
      </ul>
      ${snap.lastResults ? `<ul class="display-results">${snap.lastResults.lines.map(l=>`<li><span>${l.desc}</span><span class="ddelta">${l.delta>0?'+':''}${l.delta}</span></li>`).join('')}</ul>` : ''}
    `;
  } else if(snap.phase === 'done'){
    mainHtml = `
      <div class="display-eyebrow">GAME OVER</div>
      <div class="display-question">${sortedGroups.length ? escapeHtml(sortedGroups[0].name) + ' wins!' : ''}</div>
    `;
  }
  app.innerHTML = `
    <div class="display-wrap">
      <div class="display-main">${mainHtml}</div>
      <div class="display-sidebar">
        <h3>TALLY</h3>
        <ul class="display-tally">
          ${sortedGroups.map(g=>`<li><span>${escapeHtml(g.name)}</span><span class="dpts">${g.score}</span></li>`).join('')}
        </ul>
      </div>
    </div>
  `;
}
function fillBlankDisplay(text){
  if(!text) return '';
  return escapeHtml(text).replace('______', '<span class="blank">______</span>');
}
if(isDisplay){
  document.title = 'Fibbage — Display';
  renderDisplay(null);
  if(syncChannel){
    syncChannel.onmessage = (e)=> renderDisplay(e.data);
  } else {
    document.getElementById('app').innerHTML = `<div class="display-wrap"><div class="display-main"><div class="display-msg">Your browser doesn\'t support the live sync needed for this screen. Try Chrome, Edge, or Safari 15.4+.</div></div></div>`;
  }
} else {
  // seed Year 7-12 groups to start
  state.groups = [7,8,9,10,11,12].map(n => ({ id: uid(), name: `Year ${n}`, score: 0 }));
  render();
}
</script>
</body>
</html>
